name: validate-results

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  completed-runs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate every completed model folder
        shell: bash
        run: |
          mapfile -t runners < <(find . -mindepth 2 -maxdepth 2 -name run_row_by_row.py -print | sort)
          test "${#runners[@]}" -gt 0
          for runner in "${runners[@]}"; do
            echo "Validating ${runner}"
            python -X utf8 "${runner}" status --strict
          done
      - name: Validate public experiment archive
        shell: bash
        run: |
          python -m pip install pytest
          python -m pytest experiments/deepseek_v4_1_flash_15/shared/tests/test_suite.py -q
          python -m pytest experiments/gpt_5_6_sol_high_50/assigned/tests experiments/gpt_5_6_sol_high_50/tier1/tests -q
          python -m pytest experiments/gpt_6_sol_medium_50/assigned/tests experiments/gpt_6_sol_medium_50/tier1/tests -q
          python experiments/gpt_5_6_sol_high_50/assigned/src/publication_audit.py > /dev/null
          python experiments/gpt_5_6_sol_high_50/tier1/src/publication_audit.py > /dev/null
          python experiments/gpt_6_sol_medium_50/assigned/src/publication_audit.py > /dev/null
          python experiments/gpt_6_sol_medium_50/tier1/src/publication_audit.py > /dev/null
